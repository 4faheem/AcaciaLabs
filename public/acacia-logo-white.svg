  <path d="M15,35 L85,35" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <path d="M25,50 L75,50" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <path d="M38,65 L62,65" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <!-- Trunk and branch connections -->
  <path d="M50,35 L50,80" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
  <path d="M50,50 L38,35" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <path d="M50,50 L62,35" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <path d="M50,65 L25,50" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <path d="M50,65 L75,50" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  <!-- Tech nodes (cyber dots) in glowing cyan -->
  <circle cx="15" cy="35" r="5.5" fill="#00D1FF" />
  <circle cx="50" cy="35" r="5.5" fill="#00D1FF" />
  <circle cx="85" cy="35" r="5.5" fill="#00D1FF" />
  <circle cx="25" cy="50" r="5.5" fill="#00D1FF" />
  <circle cx="75" cy="50" r="5.5" fill="#00D1FF" />
  <circle cx="38" cy="65" r="5.5" fill="#00D1FF" />
  <circle cx="62" cy="65" r="5.5" fill="#00D1FF" />
  <circle cx="50" cy="80" r="7" fill="#FFFFFF" />
